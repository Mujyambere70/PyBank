# Runs the tests on every push to main and, if they pass, deploys to Fly.io.
# Needs one repository secret: FLY_API_TOKEN (create it with: fly tokens create deploy -x 999999h).
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
      - run: echo "No FLY_API_TOKEN secret - deploy by hand with 'fly deploy'."
        if: env.FLY_API_TOKEN == ''
