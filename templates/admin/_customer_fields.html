<div class="form-grid">
    <div class="full"><label>Full name</label><input name="full_name" value="{{ f.get('full_name', '') }}" required></div>
    <div><label>Date of birth</label><input type="date" name="dob" value="{{ f.get('dob', '') }}" max="{{ max_dob }}" required></div>
    <div><label>Gender</label><select name="gender">{% for g in ['Male', 'Female', 'Other'] %}<option {% if f.get('gender') == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div>
    <div class="full"><label>Country</label><select name="country">{% for code, name in countries %}<option value="{{ code }}" {% if f.get('country', 'IN') == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
    <div><label>Email</label><input type="email" name="email" value="{{ f.get('email', '') }}" required></div>
    <div><label>Mobile <small class="muted">(India: 10 digits, other countries: +code number)</small></label><input name="mobile" value="{{ f.get('mobile', '') }}" maxlength="16" required></div>
    <div class="full"><label>Address</label><input name="address" value="{{ f.get('address', '') }}" required></div>
    <div><label>City</label><input name="city" value="{{ f.get('city', '') }}" required></div>
    <div><label>Postal / PIN code</label><input name="pincode" value="{{ f.get('pincode', '') }}" maxlength="10" required></div>
    <div><label>State / region</label><input name="state" value="{{ f.get('state', '') }}" list="states-in"></div>
    <div><label>Occupation</label><select name="occupation">{% for o in occupations %}<option {% if f.get('occupation') == o %}selected{% endif %}>{{ o }}</option>{% endfor %}</select></div>
</div>
<datalist id="states-in">{% for s in states %}<option value="{{ s }}">{% endfor %}</datalist>
