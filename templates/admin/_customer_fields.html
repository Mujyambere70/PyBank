<div class="form-grid">
    <div class="full"><label for="customerfields-fullname">Full name</label><input id="customerfields-fullname" name="full_name" value="{{ f.get('full_name', '') }}" required></div>
    <div><label for="customerfields-dob">Date of birth</label><input id="customerfields-dob" type="date" name="dob" value="{{ f.get('dob', '') }}" max="{{ max_dob }}" required></div>
    <div><label for="customerfields-gender">Gender</label><select id="customerfields-gender" name="gender">{% for g in ['Male', 'Female', 'Other'] %}<option {% if f.get('gender') == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div>
    <div class="full"><label for="customerfields-country">Country</label><select id="customerfields-country" name="country">{% for code, name in countries %}<option value="{{ code }}" {% if f.get('country', 'IN') == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
    <div><label for="customerfields-email">Email</label><input id="customerfields-email" type="email" name="email" value="{{ f.get('email', '') }}" required></div>
    <div><label for="customerfields-mobile">Mobile <small class="muted">(India: 10 digits, other countries: +code number)</small></label><input id="customerfields-mobile" name="mobile" value="{{ f.get('mobile', '') }}" maxlength="16" required></div>
    <div class="full"><label for="customerfields-address">Address</label><input id="customerfields-address" name="address" value="{{ f.get('address', '') }}" required></div>
    <div><label for="customerfields-city">City</label><input id="customerfields-city" name="city" value="{{ f.get('city', '') }}" required></div>
    <div><label for="customerfields-pincode">Postal / PIN code</label><input id="customerfields-pincode" name="pincode" value="{{ f.get('pincode', '') }}" maxlength="10" required></div>
    <div><label for="customerfields-state">State / region</label><input id="customerfields-state" name="state" value="{{ f.get('state', '') }}" list="states-in"></div>
    <div><label for="customerfields-occupation">Occupation</label><select id="customerfields-occupation" name="occupation">{% for o in occupations %}<option {% if f.get('occupation') == o %}selected{% endif %}>{{ o }}</option>{% endfor %}</select></div>
</div>
<datalist id="states-in">{% for s in states %}<option value="{{ s }}">{% endfor %}</datalist>
