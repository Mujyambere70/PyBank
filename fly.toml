# Fly.io settings for PyBank (version 4).
# The data lives in Neon PostgreSQL: set it once with
#     fly secrets set DATABASE_URL="postgresql://..." --app michel-pybank
# (type it in your own terminal - never paste the address in a chat or a file).

app = 'michel-pybank'
primary_region = 'sin'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
